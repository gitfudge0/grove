[package]
name = "grove-gpui"
# Not on crates.io (see root Cargo.toml).
publish = false
version.workspace = true
edition.workspace = true
# NOT `rust-version.workspace = true` (that says 1.94, which is false here):
# zed at ZED_REV uses `std::hint::cold_path`, which needs rustc >= 1.95. See
# docs/superpowers/plans/2026-07-31-gpui-rewrite-03-app-shell.md (toolchain split).
rust-version = "1.95"
license.workspace = true
description = "Grove's gpui shell — the app shell for the gpui rewrite"

[[bin]]
name = "grove-gpui"
path = "src/main.rs"

[dependencies]
grove-core = { path = "../grove-core" }
grove-terminal = { path = "../grove-terminal" }
# `grove_terminal::pty::spawn` takes a `portable_pty::CommandBuilder`, which
# grove-terminal does not re-export — same workspace entry, same version.
portable-pty.workspace = true
# Same workspace entry the iced app uses — one arboard version in the graph.
arboard.workspace = true
base64.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
# `include-exclude` keeps the embed to `assets/fonts` — the icon PNGs and the
# macOS bundle art have no business inside this binary.
rust-embed = { workspace = true, features = ["include-exclude"] }
futures.workspace = true
anyhow.workspace = true
tracing.workspace = true
# The add-project wizard's directory autocomplete: `fs-err` for error messages
# that name the path, `dirs` for `~` expansion (both already in the graph).
fs-err.workspace = true
dirs.workspace = true
# Telemetry's PostHog POST (`src/telemetry.rs`) — the one network call in this
# crate that does not go through `grove_core::upgrade`. Same workspace entry
# grove-core already consumes, so no new crate enters `Cargo.lock`.
ureq.workspace = true
serde_json.workspace = true
# Vendored, not a git dep: see vendor/gpui-component/README.md for the source,
# rev, license and the full list of manifest edits.
gpui-component.workspace = true

# macOS dock badge / attention bounce (`src/platform/dock.rs`). Same version
# the iced `grove` crate already uses, so there is one `objc` in the graph.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
# Tests construct a `grove_core::upgrade::Release`, whose `version` field is a
# `semver::Version`. Dev-only: no production path in this crate parses semver.
semver.workspace = true

[lints]
workspace = true
