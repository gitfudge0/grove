[package]
name = "grove-terminal"
# Not on crates.io (see root Cargo.toml).
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Grove's headless terminal model — an alacritty_terminal wrapper in token space"

[dependencies]
alacritty_terminal.workspace = true
portable-pty.workspace = true

[dev-dependencies]
# ORACLE ONLY — never a normal dependency. vt100 is the in-tree parser the
# golden harness compares against; it must not leak into production paths.
vt100.workspace = true
serde_json.workspace = true
# Project convention (clippy.toml disallowed_methods): fs_err over std::fs, so
# IO errors name the offending path.
fs-err.workspace = true

[lints]
workspace = true
