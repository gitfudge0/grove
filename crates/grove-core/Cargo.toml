[package]
name = "grove-core"
# Not on crates.io (see root Cargo.toml).
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Grove's domain layer — git/tmux/session/storage/theme/upgrade and friends"

[dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
markdown = "1.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64.workspace = true
dirs.workspace = true
ureq = { workspace = true, features = ["json"] }
url.workspace = true
ring.workspace = true
semver.workspace = true
tracing.workspace = true
fs-err.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# Whole-file syntax highlighting for the diff viewer. Keep bundled syntax
# definitions and the pure-Rust fancy-regex parser, without enabling HTML,
# theme dumps or YAML/plist loaders. Files are parsed once in the background
# and cached. Grove uses ParseState and ScopeStack with its own palette.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
