# nextest configuration. The `ci` profile is used by .github/workflows/ci.yml.
[profile.ci]
# Run the whole suite even after a failure: one CI run should report every
# broken test, not just the first one.
fail-fast = false

# Retry twice on failure with a fixed backoff, so a flaky GUI/timing test
# doesn't red-light an otherwise good push...
retries = { backoff = "fixed", count = 2 }

# ...but a test that only passes on retry is still a bug: `flaky-result`
# makes those fail the run instead of quietly passing.
flaky-result = "fail"

# A stalled shell or native UI test must fail the run rather than occupy a
# runner until GitHub's six-hour job limit. Keep the normal slow-test warning.
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.ci.overrides]]
# This state-transition test normally takes well under a second. Shorten its
# bound so shell deadlocks emit diagnostic output without delaying the suite.
filter = 'test(closing_only_home_terminal_stays_empty_until_explicitly_opened)'
slow-timeout = { period = "15s", terminate-after = 2 }
