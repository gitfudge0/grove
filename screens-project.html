set:40px 0 0;background:rgba(0,0,0,.52);display:grid;place-items:center}.modal{background:var(--raised);border:1px solid var(--seam);border-radius:14px;width:520px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.4)}.modal h3{font-size:18px;letter-spacing:-.015em;margin:0 0 9px}.modal p{font-size:12px;line-height:1.5;color:var(--secondary);margin:0 0 14px}.modal .flow-footer{margin-top:15px;padding-top:15px}.old-panel{max-width:620px;border:1px solid var(--seam-strong);padding:28px;margin:50px auto;background:var(--raised)}.old-panel h2{font-size:21px}.old-panel .legacy-input{height:47px;border:1px solid var(--seam-strong);margin-bottom:16px;padding:13px}.old-panel .legacy-actions{display:flex;flex-direction:column;gap:12px}.old-panel .legacy-actions div{border:1px solid var(--seam-strong);padding:13px;font-size:13px;text-align:center}.before-tag{position:absolute;right:18px;top:55px;background:var(--danger);color:#fff;border-radius:4px;padding:5px 9px;font-size:10px;font-weight:700;letter-spacing:.05em}

<script>
(function(){
const icon=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#${n}"></use></svg>`;
const btn=(n,label,style='')=>`<button type="button" class="btn ${style}">${n?icon(n):''}${label}</button>`;
const field=(label,value,options={})=>`<div class="field ${options.focus?'focus':''} ${options.error?'error':''} ${options.area?'textarea':''}"><div class="label">${label}</div><div class="value ${options.placeholder?'placeholder':''}">${value}</div>${options.trailing?`<div class="trailing">${options.trailing}</div>`:''}</div>${options.error?`<div class="field-error">${options.error}</div>`:''}`;
const note=(type,text,n='info')=>`<div class="notice ${type}">${icon(n)}<span>${text}</span></div>`;
const sw=on=>`<span class="switch ${on?'on':''}"><span></span></span>`;
const side=(selected='platform-api',extra='')=>`<aside class="sidebar"><div class="side-head"><strong>Grove ${icon('chev','sm')}</strong><div class="side-actions"><span class="side-action">${icon('list')}</span><span class="side-action">${icon('grid')}</span><span class="side-action">${icon('settings')}</span></div></div><div class="side-label"><span>Projects</span><span class="side-tools"><span title="Add project">${icon('plus','sm')}</span><span title="Archived projects">${icon('archive','sm')}</span></span></div><div class="side-row ${selected==='navigation'?'selected':''}">${icon('folder')}<span class="name">navigation</span><span class="status warn"></span><span class="count">2</span><span class="tail">${icon('dots','sm')}</span></div><div class="side-row child"><span class="name">auth-refresh</span><span class="count">1</span></div><div class="side-row ${selected==='platform-api'?'selected':''}">${icon('folder')}<span class="name">platform-api</span><span class="status"></span><span class="count">3</span><span class="tail">${icon('dots','sm')}</span></div><div class="side-row child"><span class="name">main</span><span class="count">3</span></div>${extra}</aside>`;
const app=(title,inner,options={})=>`<div class="app ${options.narrow?'narrow-app':''}"><div class="appbar"><div class="traffic"><span></span><span></span><span></span></div><div class="workspace">Grove ${icon('chev','sm')}</div></div>${side(options.selected||'platform-api',options.sideExtra||'')}<main class="main"><div class="content-head"><strong>${title}</strong><span class="right">${options.crumb||'Projects / platform-api'}</span></div>${inner}</main>${options.overlay||''}</div>`;
const flow=(title,subtitle,content,actions='',options={})=>`<div class="content-body ${options.slim?'slim':''}"><div class="flow"><div class="flow-head"><h2>${title}</h2><p>${subtitle}</p></div><div class="flow-content">${content}</div>${actions?`<div class="flow-footer"><div class="group">${actions[0]||''}</div><div class="group">${actions[1]||''}</div></div>`:''}</div></div>`;

const vp=document.getElementById('viewport'),cv=document.getElementById('canvas'),pct=document.getElementById('zoomPct');let x=0,y=0,z=1;const MIN=.1,MAX=2.5;function apply(){cv.style.transform=`translate(${x}px,${y}px) scale(${z})`;pct.textContent=Math.round(z*100)+'%'}function fit(){const w=cv.scrollWidth,h=cv.scrollHeight;z=Math.max(MIN,Math.min(MAX,Math.min(innerWidth/w,innerHeight/h)*.94));x=(innerWidth-w*z)/2;y=Math.max(12,(innerHeight-h*z)/2);apply()}function zoom(next,cx=innerWidth/2,cy=innerHeight/2){const nz=Math.max(MIN,Math.min(MAX,next));x=cx-(cx-x)*(nz/z);y=cy-(cy-y)*(nz/z);z=nz;apply()}vp.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey)zoom(z*Math.exp(-e.deltaY*.01),e.clientX,e.clientY);else{x-=e.deltaX;y-=e.deltaY;apply()}},{passive:false});let panning=false,px=0,py=0;vp.addEventListener('pointerdown',e=>{if(e.target.closest('.frame-card,button,.sticky'))return;panning=true;px=e.clientX-x;py=e.clientY-y;vp.classList.add('panning');vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(panning){x=e.clientX-px;y=e.clientY-py;apply()}});vp.addEventListener('pointerup',()=>{panning=false;vp.classList.remove('panning')});vp.addEventListener('pointercancel',()=>{panning=false;vp.classList.remove('panning')});document.getElementById('zoomOut').onclick=()=>zoom(z/1.25);document.getElementById('zoomIn').onclick=()=>zoom(z*1.25);document.getElementById('zoomFit').onclick=fit;document.getElementById('themeToggle').onclick=function(){const d=document.documentElement.classList.toggle('dark');this.textContent=d?'☀ Light':'☾ Dark'};fit();window.addEventListener('resize',fit);
