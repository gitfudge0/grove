<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Grove dark window preview</title>
  <desc id="desc">A 260 pixel sidebar in dark gray beside a 740 pixel darker gray canvas.</desc>
  <rect width="260" height="640" fill="#242424"/>
  <rect x="260" width="740" height="640" fill="#1a1a1a"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="20" y="42" fill="#f7f7f8" font-size="15" font-weight="600">Grove</text>
    <text x="222" y="42" fill="#aaaab2" font-size="20">⌕</text>
    <text x="20" y="88" fill="#aaaab2" font-size="11" font-weight="600" letter-spacing="1.2">WORKSPACES</text>

    <rect x="12" y="103" width="236" height="36" rx="7" fill="#333337"/>
    <circle cx="29" cy="121" r="5" fill="#80b59d"/>
    <text x="43" y="126" fill="#f7f7f8" font-size="13">grove</text>
    <text x="224" y="126" fill="#aaaab2" font-size="15">⌄</text>

    <text x="42" y="162" fill="#aaaab2" font-size="12">main</text>
    <text x="42" y="191" fill="#aaaab2" font-size="12">ui-overhaul</text>
    <circle cx="27" cy="187" r="3" fill="#80b59d"/>
    <text x="20" y="242" fill="#aaaab2" font-size="11" font-weight="600" letter-spacing="1.2">SESSIONS</text>
    <text x="28" y="276" fill="#f7f7f8" font-size="12">●  Terminal</text>
    <text x="28" y="306" fill="#aaaab2" font-size="12">◌  New session</text>

    <line x1="0" y1="593" x2="260" y2="593" stroke="#34343a"/>
    <circle cx="30" cy="617" r="8" fill="#515158"/>
    <text x="47" y="622" fill="#aaaab2" font-size="12">Settings</text>

    <text x="292" y="42" fill="#f7f7f8" font-size="16" font-weight="600">ui-overhaul</text>
    <text x="292" y="67" fill="#aaaab2" font-size="12">Workspace overview</text>
    <line x1="260" y1="88" x2="1000" y2="88" stroke="#34343a"/>
    <text x="292" y="134" fill="#aaaab2" font-size="11" font-weight="600" letter-spacing="1.2">ACTIVE SESSION</text>
    <rect x="292" y="151" width="676" height="126" rx="9" fill="#242424"/>
    <text x="314" y="182" fill="#f7f7f8" font-size="13" font-weight="600">Terminal</text>
    <text x="314" y="207" fill="#aaaab2" font-size="12">~/grove/ui-overhaul</text>
    <text x="314" y="245" fill="#80b59d" font-size="12">$</text>
    <text x="329" y="245" fill="#f7f7f8" font-size="12">cargo run</text>
  </g>
</svg>
