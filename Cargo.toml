[workspace]
members = ["crates/grove-core"]

[workspace.package]
version = "0.45.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

# Denied in production paths only. CI runs a second `--all-targets` pass with
# these allowed, so test modules keep using unwrap() freely.
[workspace.lints.rust]
# objc 0.2's macros expand `cfg(feature = "cargo-clippy")`; register the
# value so `unexpected_cfgs` stays quiet on macOS. The `#![allow]` in
# src/gui/dock.rs doesn't reach lints raised inside external macro
# expansions, so this workspace-level registration is the reliable fix.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
# Pedantic opt-outs. Each is either pure style churn or would require broad,
# behavior-adjacent refactors that this codebase deliberately doesn't want.
must_use_candidate = "allow"          # #[must_use] on every getter is noise
missing_errors_doc = "allow"          # internal binary, errors are self-evident
missing_panics_doc = "allow"          # ditto for panics
doc_markdown = "allow"                # prose comments aren't rustdoc-formatted
too_many_lines = "allow"              # iced `view`/`update` fns are naturally long
module_name_repetitions = "allow"     # gui::session::SessionState reads fine
cast_possible_truncation = "allow"    # GUI layout math is f32<->int by nature
cast_precision_loss = "allow"         # ditto
cast_possible_wrap = "allow"          # ditto
cast_sign_loss = "allow"              # ditto
cast_lossless = "allow"               # `as f32` is clearer than `f32::from`
float_cmp = "allow"                   # exact compares are intentional in layout tests
similar_names = "allow"               # row/col, x0/x1 style names are deliberate
many_single_char_names = "allow"      # geometry code uses x/y/w/h
struct_excessive_bools = "allow"      # UI state genuinely has many flags
fn_params_excessive_bools = "allow"   # ditto
unreadable_literal = "allow"          # color/keycode literals read better raw
match_same_arms = "allow"             # keeping arms separate documents intent
unused_self = "allow"                 # method form kept for API symmetry
needless_pass_by_value = "allow"      # iced messages are moved by design
option_option = "allow"               # "unset vs cleared" is a real distinction here
ref_option = "allow"                  # &Option<T> keeps call sites simple
single_match_else = "allow"           # match reads better than if-let here
if_not_else = "allow"                 # negated conditions often match the domain
wildcard_imports = "allow"            # module preludes are used intentionally
trivially_copy_pass_by_ref = "allow"  # consistency with sibling signatures
unnecessary_wraps = "allow"           # Result kept for forward compatibility
# `.lock`/`.dmg`/`.app` suffixes are exact by spec (git refs, release assets,
# macOS bundles) — case-insensitive matching would change behavior.
case_sensitive_file_extension_comparisons = "allow"

[workspace.dependencies]
serde_json = "1"
anyhow = "1"
dirs = "5"
vt100 = "0.15"
ureq = { version = "2", features = ["tls"], default-features = false }
semver = "1"
tracing = "0.1"
fs-err = "3"
tempfile = "3"
thiserror = "2"
# Already in the tree via ureq's rustls stack — used only for `ring::digest`
# (SHA-256 of a downloaded release asset), so this adds no new supply chain.
ring = "0.17"

[package]
name = "grove"
# Not on crates.io; also lets cargo-deny's allow-wildcard-paths accept the
# version-less grove-core path dependency.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Grove — a worktree launchpad for AI coding agents"

[[bin]]
name = "grove"
path = "src/main.rs"

[package.metadata.bundle]
name = "Grove"
identifier = "dev.grove.Grove"
icon = [
    "assets/icon/32x32.png",
    "assets/icon/128x128.png",
    "assets/icon/128x128@2x.png",
    "assets/icon/512x512.png",
]
category = "Developer Tool"
short_description = "A worktree launchpad for AI coding agents"
copyright = "Copyright (c) 2026 Grove"

[dependencies]
grove-core = { path = "crates/grove-core" }
anyhow.workspace = true
dirs.workspace = true
serde_json.workspace = true
vt100.workspace = true
fs-err.workspace = true
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22"
iced = { version = "0.14.0", features = ["tokio", "advanced", "svg", "canvas"] }
ureq.workspace = true
semver.workspace = true
tokio = { version = "1", features = ["time"] }
rfd = "0.17"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
smol_str = "0.2"
