[package]
name = "grove"
version = "0.21.0"
edition = "2021"
description = "Grove — a worktree launchpad for AI coding agents"

[[bin]]
name = "grove"
path = "src/main.rs"

[package.metadata.bundle]
name = "Grove"
identifier = "dev.grove.Grove"
icon = [
    "assets/icon/32x32.png",
    "assets/icon/128x128.png",
    "assets/icon/128x128@2x.png",
    "assets/icon/512x512.png",
]
category = "Developer Tool"
short_description = "A worktree launchpad for AI coding agents"
copyright = "Copyright (c) 2026 Grove"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
portable-pty = "0.9"
vt100 = "0.15"
arboard = "3"
base64 = "0.22"
keepawake = "0.6.0"
iced = { version = "0.13", features = ["tokio", "advanced", "svg", "canvas"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
smol_str = "0.2"
