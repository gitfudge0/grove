[package]
name = "grove"
version = "0.3.0"
edition = "2021"
description = "Grove — a worktree launchpad for AI coding agents"

[[bin]]
name = "grove"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
portable-pty = "0.9"
tui-term = "0.2"
vt100 = "0.15"
arboard = "3"
base64 = "0.22"
