[workspace]
members = ["crates/grove-core", "crates/grove-terminal"]
# Vendored third-party source (gpui rewrite plan 08 Task 1). A path dependency
# is otherwise auto-promoted to a workspace member, which would subject
# vendored code to our `[lints]` and to `--all-targets` clippy. See
# vendor/gpui-component/README.md for provenance.
exclude = [
    "vendor/gpui-component/ui",
    "vendor/gpui-component/macros",
    "vendor/gpui-component/assets",
]

# `log` is declared by the vendored gpui-component crate and reached only
# through macros cargo-machete's regex scan cannot see. The vendored manifests
# are third-party source we do not edit, so the ignore lives here.
[workspace.metadata.cargo-machete]
ignored = ["log"]

[workspace.package]
version = "0.45.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

# Denied in production paths only. CI runs a second `--all-targets` pass with
# these allowed, so test modules keep using unwrap() freely.
[workspace.lints.rust]
# objc 0.2's macros expand `cfg(feature = "cargo-clippy")`; register the
# value so `unexpected_cfgs` stays quiet on macOS. A crate-level `#![allow]`
# doesn't reach lints raised inside external macro expansions, so this
# workspace-level registration is the reliable fix.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
# Pedantic opt-outs. Each is either pure style churn or would require broad,
# behavior-adjacent refactors that this codebase deliberately doesn't want.
must_use_candidate = "allow"          # #[must_use] on every getter is noise
missing_errors_doc = "allow"          # internal binary, errors are self-evident
missing_panics_doc = "allow"          # ditto for panics
doc_markdown = "allow"                # prose comments aren't rustdoc-formatted
too_many_lines = "allow"              # gpui `render` fns are naturally long
module_name_repetitions = "allow"     # gui::session::SessionState reads fine
cast_possible_truncation = "allow"    # GUI layout math is f32<->int by nature
cast_precision_loss = "allow"         # ditto
cast_possible_wrap = "allow"          # ditto
cast_sign_loss = "allow"              # ditto
cast_lossless = "allow"               # `as f32` is clearer than `f32::from`
float_cmp = "allow"                   # exact compares are intentional in layout tests
similar_names = "allow"               # row/col, x0/x1 style names are deliberate
many_single_char_names = "allow"      # geometry code uses x/y/w/h
struct_excessive_bools = "allow"      # UI state genuinely has many flags
fn_params_excessive_bools = "allow"   # ditto
unreadable_literal = "allow"          # color/keycode literals read better raw
match_same_arms = "allow"             # keeping arms separate documents intent
unused_self = "allow"                 # method form kept for API symmetry
needless_pass_by_value = "allow"      # gpui event/action values are moved by design
option_option = "allow"               # "unset vs cleared" is a real distinction here
ref_option = "allow"                  # &Option<T> keeps call sites simple
single_match_else = "allow"           # match reads better than if-let here
if_not_else = "allow"                 # negated conditions often match the domain
wildcard_imports = "allow"            # module preludes are used intentionally
trivially_copy_pass_by_ref = "allow"  # consistency with sibling signatures
unnecessary_wraps = "allow"           # Result kept for forward compatibility
# `.lock`/`.dmg`/`.app` suffixes are exact by spec (git refs, release assets,
# macOS bundles) — case-insensitive matching would change behavior.
case_sensitive_file_extension_comparisons = "allow"

[workspace.dependencies]
# Pinned by exact rev (gpui rewrite plan 02): never a branch or version range.
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
# Pinned by exact rev (gpui rewrite plan 03): never a branch or version range.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }
# gpui_platform's own default features are EMPTY — without wayland/x11 the Linux
# platform has no backend. Bootstrap lives here, not in gpui.
#
# runtime_shaders (macOS only; a no-op elsewhere): without it, gpui_macos's
# build.rs compiles shaders.metal offline via `xcrun metal`, a tool that ships
# only with full Xcode — so the build fails on any machine with just the
# Command Line Tools installed. With it, the shader source is stitched into the
# binary and compiled by Metal's in-OS runtime compiler at window creation.
# That keeps `cargo build` working identically on every machine and in CI, at
# the cost of one shader compile per launch.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
# Vendored at GPUI_COMPONENT_REV 88f102d13654fe25aa2fede076274b6b751a3704 and
# consumed by path so the pin is durable and offline. Provenance, the crate
# subset and every manifest edit: vendor/gpui-component/README.md.
gpui-component = { path = "vendor/gpui-component/ui" }
rust-embed = "8"
futures = "0.3"
# Promoted from the root package's `[dependencies]` (same version + features) —
# gpui rewrite plan 04 Task 1 Step 2.
arboard = { version = "3", features = ["wayland-data-control"] }
# Promoted alongside arboard: OSC 52 clipboard writes need it (gpui rewrite
# plan 04 Task 5 Step 5).
base64 = "0.22"
portable-pty = "0.9"
serde_json = "1"
anyhow = "1"
dirs = "5"
ureq = { version = "2", features = ["tls"], default-features = false }
semver = "1"
tracing = "0.1"
fs-err = "3"
tempfile = "3"
thiserror = "2"
# Already in the tree via ureq's rustls stack — used only for `ring::digest`
# (SHA-256 of a downloaded release asset), so this adds no new supply chain.
ring = "0.17"

[package]
name = "grove"
# Not on crates.io; also lets cargo-deny's allow-wildcard-paths accept the
# version-less grove-core path dependency.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Grove — a worktree launchpad for AI coding agents"

[[bin]]
name = "grove"
path = "src/main.rs"

[package.metadata.bundle]
name = "Grove"
identifier = "dev.grove.Grove"
icon = [
    "assets/icon/32x32.png",
    "assets/icon/128x128.png",
    "assets/icon/128x128@2x.png",
    "assets/icon/512x512.png",
]
category = "Developer Tool"
short_description = "A worktree launchpad for AI coding agents"
copyright = "Copyright (c) 2026 Grove"

[dependencies]
grove-core = { path = "crates/grove-core" }
grove-terminal = { path = "crates/grove-terminal" }
# `grove_terminal::pty::spawn` takes a `portable_pty::CommandBuilder`, which
# grove-terminal does not re-export — same workspace entry, same version.
portable-pty.workspace = true
arboard.workspace = true
base64.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
# `include-exclude` keeps the embed to `assets/fonts` — the icon PNGs and the
# macOS bundle art have no business inside this binary.
rust-embed = { workspace = true, features = ["include-exclude"] }
futures.workspace = true
anyhow.workspace = true
tracing.workspace = true
# The add-project wizard's directory autocomplete: `fs-err` for error messages
# that name the path, `dirs` for `~` expansion (both already in the graph).
fs-err.workspace = true
dirs.workspace = true
# Telemetry's PostHog POST (`src/telemetry.rs`) — the one network call in this
# crate that does not go through `grove_core::upgrade`. Same workspace entry
# grove-core already consumes, so no new crate enters `Cargo.lock`.
ureq.workspace = true
serde_json.workspace = true
# Vendored, not a git dep: see vendor/gpui-component/README.md for the source,
# rev, license and the full list of manifest edits.
gpui-component.workspace = true

[lints]
workspace = true

# macOS dock badge / attention bounce (`src/platform/dock.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
# Tests construct a `grove_core::upgrade::Release`, whose `version` field is a
# `semver::Version`.
semver.workspace = true
# gpui's `TestAppContext`/`VisualTestContext` and the `#[gpui::test]` macro —
# used by the modal-focus regression test (`views::modals`).
gpui = { workspace = true, features = ["test-support"] }
