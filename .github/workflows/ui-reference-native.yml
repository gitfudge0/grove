name: Native reference acceptance
on:
  workflow_dispatch:
jobs:
  paired-metal:
    # Metal and pinned browser are explicit infrastructure requirements. An
    # absent supported runner leaves this check pending, never implicitly passed.
    runs-on: [self-hosted, macOS, grove-metal-reference]
    env:
      GROVE_CHROME_EXECUTABLE: ${{ vars.GROVE_REFERENCE_CHROME_EXECUTABLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Paired immutable references and actual native event routes
        run: node scripts/test-ui-reference-native.mjs "$RUNNER_TEMP/ui-reference-evidence"
      - name: Reject actual native defects and certify restored rendering
        run: node scripts/test-ui-reference-native-mutations.mjs "$RUNNER_TEMP/ui-reference-evidence/registered-row" "$RUNNER_TEMP/ui-reference-evidence/mutations"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-metal-reference-evidence
          path: ${{ runner.temp }}/ui-reference-evidence
