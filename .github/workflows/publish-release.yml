name: Publish prepared release
# Explicitly promote installers from one successful preparation run. No compiler.
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing version tag with a draft release and reviewed release notes
        required: true
        type: string
      candidate_run:
        description: Successful Release bundles run ID for this exact tagged commit on main
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ inputs.source_tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate draft and tag
        env:
          RELEASE_TAG: ${{ inputs.source_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a version tag' >&2; exit 1; }
          git rev-parse "refs/tags/$RELEASE_TAG^{commit}" > "$RUNNER_TEMP/release-sha"
          [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ] || { echo 'Expected an existing draft release' >&2; exit 1; }
      - name: Download and verify candidate installers
        env:
          RELEASE_TAG: ${{ inputs.source_tag }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use current trusted tooling, but validate against the tagged source.
          cp scripts/release-candidate.py "$RUNNER_TEMP/release-candidate.py"
          # The helper resolves HEAD, so detach to the already validated local tag.
          git checkout --detach "$(cat "$RUNNER_TEMP/release-sha")"
          python "$RUNNER_TEMP/release-candidate.py" download "$CANDIDATE_RUN" "$RELEASE_TAG" "$RUNNER_TEMP/candidate" > "$RUNNER_TEMP/installers"
      - name: Attach installers and publish
        env:
          RELEASE_TAG: ${{ inputs.source_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t installers < "$RUNNER_TEMP/installers"
          [ "${#installers[@]}" = 4 ]
          # Recheck after download; a rerun cannot mutate an already published release.
          [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]
          gh release upload "$RELEASE_TAG" "${installers[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
