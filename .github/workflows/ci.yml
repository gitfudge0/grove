name: CI

# Run formatting, lint, and test checks on every push to main and on every
# pull request, so regressions are caught before they land.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # No `toolchain` input: actions-rust-lang reads the pinned channel out
      # of rust-toolchain.toml, so the file is the single source of truth for
      # both local and CI builds. (dtolnay/rust-toolchain can't do this — it
      # hard-requires an explicit toolchain input.) cache: false because the
      # explicit cache step below already covers registry + target.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-cargo-${{ matrix.os }}-

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # GUI (iced) + bundling prerequisites.
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config dpkg

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Two clippy passes are intentional: tests may `unwrap()`/`expect()`
      # freely, but production code may not (see [lints.clippy] in
      # Cargo.toml). Collapsing this into one pass would either let
      # production code slip past the deny, or force test code to stop
      # unwrapping.
      # grove-gpui is deliberately NOT built in CI: it needs rustc >= 1.95 and
      # Linux GUI system deps this runner does not install, and it is excluded
      # from `default-members` (gpui rewrite plan 03, Task 1). An all-members
      # flag would pull it in regardless, so every invocation below names the
      # members explicitly. grove-gpui joins CI in Plan 10, when iced is deleted
      # and it becomes the product.
      - name: Clippy (all targets, tests allowed to unwrap)
        run: cargo clippy -p grove -p grove-core -p grove-terminal --all-targets -- -D warnings -A clippy::unwrap_used -A clippy::expect_used

      # Production paths only (no --all-targets, so #[cfg(test)] modules
      # aren't compiled here) — the Cargo.toml unwrap/expect denies apply.
      - name: Clippy (production code)
        run: cargo clippy -p grove -p grove-core -p grove-terminal -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # nextest gives per-test process isolation and the retry/flaky policy in
      # .config/nextest.toml (profile `ci`).
      - name: Run tests
        run: cargo nextest run -p grove -p grove-core -p grove-terminal --locked --profile ci

      # nextest cannot run doctests, so they need a separate `cargo test` pass.
      - name: Run doctests
        run: cargo test --doc -p grove -p grove-core -p grove-terminal --locked

  hygiene:
    name: Hygiene (typos, unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both tools are source-level only (typos scans text, cargo-machete
      # parses Cargo.toml/`use` statements with regexes), so this job needs
      # neither a Rust toolchain nor the GUI build deps — it stays fast.
      - name: Install typos and cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,cargo-machete

      - name: Check spelling
        run: typos

      - name: Check for unused dependencies
        run: cargo machete

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
