name: CI

# Run formatting, lint, and test checks on every push to main and on every
# pull request, so regressions are caught before they land.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # No `toolchain` input: actions-rust-lang reads the pinned channel out
      # of rust-toolchain.toml, so the file is the single source of truth for
      # both local and CI builds. (dtolnay/rust-toolchain can't do this — it
      # hard-requires an explicit toolchain input.) cache: false because the
      # explicit cache step below already covers registry + target.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-cargo-${{ matrix.os }}-

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gpui (Linux) + bundling prerequisites. Derived from this branch's
          # actual dependency graph, not copied from upstream docs:
          #   fontconfig/freetype  zed-font-kit -> yeslogic-fontconfig-sys and
          #                        freetype-sys, both pkg-config probes that
          #                        emit -lfontconfig / -lfreetype
          #   xkbcommon(+x11), xcb xkbcommon 0.8 links them directly (no
          #                        build.rs); `ldd target/release/grove` shows
          #                        libxkbcommon, libxkbcommon-x11, libxcb
          #   wayland              wayland-sys is used in dlopen mode, so it is
          #                        a *runtime* need, not a link-time one; kept
          #                        so a future non-dlopen build does not break
          #   rsvg/ssl/pkg-config/dpkg  unchanged (bundling + TLS)
          # Vulkan is loaded at runtime by ash; CI never opens a window, so no
          # libvulkan here.
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev \
            librsvg2-dev libssl-dev pkg-config dpkg

      # NOT `--all`: cargo-fmt's `--all` walks every package whose manifest
      # lives under the workspace root, including the `exclude`d vendored
      # gpui-component crates, which are third-party source we do not reformat.
      # Naming the three real members keeps the check on our own code.
      - name: Check formatting
        run: cargo fmt -p grove -p grove-core -p grove-terminal -- --check

      # Two clippy passes are intentional: tests may `unwrap()`/`expect()`
      # freely, but production code may not (see [lints.clippy] in
      # Cargo.toml). Collapsing this into one pass would either let
      # production code slip past the deny, or force test code to stop
      # unwrapping.
      # `--workspace` is safe here: the three vendored gpui-component crates
      # are workspace-`exclude`d (see Cargo.toml), so they are never linted or
      # tested as members even though they are path dependencies.
      - name: Clippy (all targets, tests allowed to unwrap)
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::unwrap_used -A clippy::expect_used

      # Production paths only (no --all-targets, so #[cfg(test)] modules
      # aren't compiled here) — the Cargo.toml unwrap/expect denies apply.
      - name: Clippy (production code)
        run: cargo clippy --workspace -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # nextest gives per-test process isolation and the retry/flaky policy in
      # .config/nextest.toml (profile `ci`).
      - name: Run tests
        run: cargo nextest run --workspace --locked --profile ci

      # nextest cannot run doctests, so they need a separate `cargo test` pass.
      - name: Run doctests
        run: cargo test --doc --workspace --locked

  hygiene:
    name: Hygiene (typos, unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both tools are source-level only (typos scans text, cargo-machete
      # parses Cargo.toml/`use` statements with regexes), so this job needs
      # neither a Rust toolchain nor the GUI build deps — it stays fast.
      - name: Install typos and cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,cargo-machete

      - name: Check spelling
        run: typos

      - name: Check for unused dependencies
        run: cargo machete

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
