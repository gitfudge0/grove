name: CI

# Keep PR clearance source-only. Builds, Rust tests, native smoke checks,
# hygiene and supply-chain checks run after changes land on main.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR checks without cancelling main's cache-producing runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Preserve the existing required-check name without an extra aggregation job.
  required:
    name: CI result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      # Explicit members exclude third-party vendored formatting.
      - name: Check formatting
        run: cargo fmt -p grove -p grove-core -p grove-terminal -- --check
      - name: Verify strict reference comparator mutation cases
        run: node scripts/test-ui-reference-verifier.mjs
      - name: Check build tooling
        run: |
          python3 scripts/check-repository-artifacts.py
          python3 scripts/test-repository-artifacts.py
          python3 scripts/test-install.py
          python3 scripts/test-ci-changes.py

  check:
    name: Check (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `toolchain` input: actions-rust-lang reads the pinned channel out
      # of rust-toolchain.toml, so the file is the single source of truth for
      # both local and CI builds. (dtolnay/rust-toolchain can't do this — it
      # hard-requires an explicit toolchain input.) cache: false because the
      # explicit cache step below already covers registry + target.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-
      # Immutable entries advance on every commit, while restoring the latest
      # compatible snapshot. Toolchain/profile/platform changes cannot collide.
      - name: Cache compiled artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ci-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: ci-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}-

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gpui (Linux) + bundling prerequisites. Derived from this branch's
          # actual dependency graph, not copied from upstream docs:
          #   fontconfig/freetype  zed-font-kit -> yeslogic-fontconfig-sys and
          #                        freetype-sys, both pkg-config probes that
          #                        emit -lfontconfig / -lfreetype
          #   xkbcommon(+x11), xcb xkbcommon 0.8 links them directly (no
          #                        build.rs); `ldd target/release/grove` shows
          #                        libxkbcommon, libxkbcommon-x11, libxcb
          #   wayland              wayland-sys is used in dlopen mode, so it is
          #                        a *runtime* need, not a link-time one; kept
          #                        so a future non-dlopen build does not break
          #   rsvg/ssl/pkg-config/dpkg  unchanged (bundling + TLS)
          # Vulkan is loaded at runtime by ash; CI never opens a window, so no
          # libvulkan here.
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libx11-dev libxext-dev xvfb xauth libxtst6 \
            librsvg2-dev libssl-dev pkg-config dpkg dbus dconf-service dconf-gsettings-backend

      - name: Check Linux text preference notifications
        if: runner.os == 'Linux'
        run: python3 scripts/test-linux-text-preferences.py
      - name: Exercise the native WebKitGTK surface
        if: runner.os == 'Linux'
        run: python3 scripts/verify-inline-html-linux.py

      # Two clippy passes are intentional: tests may `unwrap()`/`expect()`
      # freely, but production code may not (see [lints.clippy] in
      # Cargo.toml). Collapsing this into one pass would either let
      # production code slip past the deny, or force test code to stop
      # unwrapping.
      # `--workspace` is safe here: the three vendored gpui-component crates
      # are workspace-`exclude`d (see Cargo.toml), so they are never linted or
      # tested as members even though they are path dependencies.
      - name: Clippy (all targets, tests allowed to unwrap)
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::unwrap_used -A clippy::expect_used

      # Production paths only (no --all-targets, so #[cfg(test)] modules
      # aren't compiled here) — the Cargo.toml unwrap/expect denies apply.
      - name: Clippy (production code)
        run: cargo clippy --workspace -- -D warnings

      - name: Reject stale authored reference and generated recipe
        run: node scripts/ui-reference.mjs validate ui-references/fixtures/pilot.json "$RUNNER_TEMP/ui-reference-validation"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # nextest gives per-test process isolation and the retry/flaky policy in
      # .config/nextest.toml (profile `ci`).
      - name: Run tests
        # Unoptimized GPUI render trees exceed libtest's default 2 MiB stack.
        # Use the same bounded stack as isolated native QA; retain all test,
        # timeout and flaky-failure policies.
        env:
          RUST_MIN_STACK: 16777216
        run: cargo nextest run --workspace --locked --profile ci

      # nextest cannot run doctests, so they need a separate `cargo test` pass.
      - name: Run doctests
        run: cargo test --doc --workspace --locked

  windows-inline-html:
    name: Windows inline HTML compile
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-
      # Immutable entries advance on every commit, while restoring the latest
      # compatible snapshot. Toolchain/profile/platform changes cannot collide.
      - name: Cache compiled artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ci-inline-html-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: ci-inline-html-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}-
      # A production check is required: cfg(test) substitutes the native surface
      # with a visibility probe and would omit the WebView2 implementation.
      - name: Compile the native WebView2 backend
        run: cargo check -p grove --locked
      - name: Exercise the native WebView2 surface
        shell: pwsh
        run: ./scripts/verify-inline-html-windows.ps1

  hygiene:
    if: github.event_name == 'push'
    name: Hygiene (typos, unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both tools are source-level only (typos scans text, cargo-machete
      # parses Cargo.toml/`use` statements with regexes), so this job needs
      # neither a Rust toolchain nor the GUI build deps — it stays fast.
      - name: Install typos and cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,cargo-machete

      - name: Check spelling
        run: typos

      - name: Check for unused dependencies
        run: cargo machete

  deny:
    if: github.event_name == 'push'
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
