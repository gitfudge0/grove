name: Release bundles

# Build candidates on main so later versions can restore its release caches.
# Publication is a separate explicit workflow and never compiles the app.
# source_tag retains draft-only recovery for an existing tagged release.
on:
  push:
    branches: [main]
    paths-ignore: ['product/**', '*.md', '.agents/**', '.claude/**']
  workflow_dispatch:
    inputs:
      source_tag:
        description: Optional existing draft release tag for recovery; empty prepares a candidate
        type: string
        default: ''
      platform:
        description: Platforms to bundle
        type: choice
        options: [all, macos-x86_64]
        default: all
# Superseded preparation runs can stop; tagged recovery runs are independent.
concurrency:
  group: release-${{ inputs.source_tag || format('prepare-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.source_tag == '' || github.event_name == 'push' }}

permissions:
  contents: read

# Baked into the binary at compile time (src/telemetry.rs option_env!).
# Unset (e.g. forked-PR runs) simply ships with telemetry disabled.
env:
  GROVE_POSTHOG_KEY: ${{ secrets.GROVE_POSTHOG_KEY }}

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write  # Only tagged recovery uploads to an existing draft.
    name: Bundle (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Recovery runs reuse the tagged sources and leave completed bundles alone.
        include: ${{ fromJSON(inputs.platform == 'macos-x86_64' && '[{"os":"macos","arch":"x86_64","runner":"macos-latest","format":"osx","target":"x86_64-apple-darwin"}]' || '[{"os":"macos","arch":"arm64","runner":"macos-latest","format":"osx"},{"os":"macos","arch":"x86_64","runner":"macos-latest","format":"osx","target":"x86_64-apple-darwin"},{"os":"linux","arch":"amd64","runner":"ubuntu-latest","format":"deb"},{"os":"windows","arch":"x86_64","runner":"windows-latest"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_tag || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate candidate or draft recovery
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.source_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected an existing version tag" >&2; exit 1; }
            [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" ] || { echo "Checkout does not match release tag" >&2; exit 1; }
            [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ] || { echo "Recovery requires an existing draft release" >&2; exit 1; }
            python scripts/release-candidate.py check-tag "$RELEASE_TAG"
          fi

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache compiled release artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: release-${{ matrix.os }}-${{ matrix.arch }}-v3-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}-${{ inputs.source_tag }}
          restore-keys: |
            release-${{ matrix.os }}-${{ matrix.arch }}-v3-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-
            release-${{ matrix.os }}-${{ matrix.arch }}-v3-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
            release-${{ matrix.os }}-${{ matrix.arch }}-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}-
          # Cargo validates fingerprints after restoration, including toolchain,
          # profile and dependency changes. Version bumps retain reusable crates.

      - name: Install Linux build deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          # gpui (Linux) + bundling prerequisites. Kept in lockstep with the
          # same step in ci.yml, which is derived from this branch's actual
          # dependency graph rather than upstream docs:
          #   fontconfig/freetype  zed-font-kit -> yeslogic-fontconfig-sys and
          #                        freetype-sys, both pkg-config probes that
          #                        emit -lfontconfig / -lfreetype
          #   xkbcommon(+x11), xcb xkbcommon 0.8 links them directly (no
          #                        build.rs); `ldd target/release/grove` shows
          #                        libxkbcommon, libxkbcommon-x11, libxcb
          #   wayland              wayland-sys is used in dlopen mode, so it is
          #                        a *runtime* need, not a link-time one; kept
          #                        so a future non-dlopen build does not break
          #   rsvg/ssl/pkg-config  unchanged (bundling + TLS)
          #   dpkg                 cargo-bundle shells out to it for the .deb
          #                        this job ships; preinstalled on ubuntu-latest
          #                        but named explicitly so an image change can't
          #                        silently break the Linux release artifact
          # Vulkan is loaded at runtime by ash; this job never opens a window,
          # so no libvulkan here.
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libx11-dev libxext-dev \
            librsvg2-dev libssl-dev pkg-config dpkg xz-utils

      - name: Add cross-compile target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # The Intel macOS target also uses an ARM64 host packaging executable.
      - name: Prepare packaging tool
        uses: ./.github/actions/release-tools

      - name: Clear stale bundle output while retaining compiled dependencies
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ -n "$TARGET" ]; then
            rm -rf "target/$TARGET/release/bundle"
          else
            rm -rf target/release/bundle
          fi

      - name: Build release bundle (macOS/Linux)
        if: matrix.os != 'windows'
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo bundle -p grove --release --format ${{ matrix.format }} --target ${{ matrix.target }}
          else
            cargo bundle -p grove --release --format ${{ matrix.format }}
          fi

      - name: Build release binary (Windows)
        if: matrix.os == 'windows'
        run: cargo build -p grove --release --locked

      - name: Package artifacts (macOS/Linux)
        if: matrix.os != 'windows'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          OUT="dist"
          mkdir -p "$OUT"

          if [ "${{ matrix.os }}" = "macos" ]; then
            BUNDLE_DIR="target/release/bundle/osx"
            if [ -n "${{ matrix.target }}" ]; then
              BUNDLE_DIR="target/${{ matrix.target }}/release/bundle/osx"
            fi
            APP="$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.app' | head -n1)"
            [ -n "$APP" ] || { echo "no .app produced" >&2; exit 1; }
            # Packaging adds the selected installer art to a staged app copy,
            # then ad-hoc signs it; never mutate an already signed release app.
            # Wrap the .app in a .dmg for distribution.
            DMG="$OUT/Grove-${VERSION}-macos-${{ matrix.arch }}.dmg"
            scripts/package-macos-dmg.sh "$APP" "$DMG"
            echo "Built $DMG"
          else
            DEB="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n1)"
            [ -n "$DEB" ] || { echo "no .deb produced" >&2; exit 1; }
            # Repack cargo-bundle's package with xz compression, preserving
            # package contents and control metadata with root ownership.
            DEB_TEMP="$(mktemp -d)"
            trap 'rm -rf -- "$DEB_TEMP"' EXIT
            dpkg-deb --raw-extract "$DEB" "$DEB_TEMP/package"
            dpkg-deb --build --root-owner-group -Zxz -z6 "$DEB_TEMP/package" "$OUT/Grove-${VERSION}-linux-amd64.deb"
            echo "Built $OUT/Grove-${VERSION}-linux-amd64.deb"
          fi

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          mkdir -p dist
          # -p grove: required since the grove-core workspace split — cargo-wix
          # refuses to guess which workspace member to package.
          cargo wix -p grove --no-build --nocapture -o "dist/Grove-${VERSION}-windows-x86_64-alpha.msi"
          echo "Built dist/Grove-${VERSION}-windows-x86_64-alpha.msi"

      - name: Record candidate identity and checksums
        shell: bash
        run: python scripts/release-candidate.py record dist '${{ matrix.os }}-${{ matrix.arch }}'

      - name: Retain candidate installers
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Recheck draft before recovery upload
        if: inputs.source_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.source_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ] || { echo 'Release is no longer draft' >&2; exit 1; }

      - name: Upload bundles to release
        if: inputs.source_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.source_tag }}
          draft: true
          fail_on_unmatched_files: true
          files: dist/Grove-*
