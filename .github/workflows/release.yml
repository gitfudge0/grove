name: Release bundles

# Draft releases do not trigger release events. Run this workflow from a draft's
# tag, or provide source_tag from main, to attach bundles while keeping it draft.
# Published releases run normally.
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing release tag to bundle (leave empty when running from its tag)
        type: string
        default: ''
      platform:
        description: Platforms to bundle
        type: choice
        options: [all, macos-x86_64]
        default: all
  release:
    types: [published]

permissions:
  contents: write

# Baked into the binary at compile time (src/telemetry.rs option_env!).
# Unset (e.g. forked-PR runs) simply ships with telemetry disabled.
env:
  GROVE_POSTHOG_KEY: ${{ secrets.GROVE_POSTHOG_KEY }}

jobs:
  bundle:
    # Assets on publication mean the draft was already bundled from its tag.
    if: (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.source_tag != '')) && (github.event_name == 'workflow_dispatch' || github.event.release.assets[0] == null)
    name: Bundle (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Recovery runs reuse the tagged sources and leave completed bundles alone.
        include: ${{ fromJSON(inputs.platform == 'macos-x86_64' && '[{"os":"macos","arch":"x86_64","runner":"macos-latest","format":"osx","target":"x86_64-apple-darwin"}]' || '[{"os":"macos","arch":"arm64","runner":"macos-latest","format":"osx"},{"os":"macos","arch":"x86_64","runner":"macos-latest","format":"osx","target":"x86_64-apple-darwin"},{"os":"linux","arch":"amd64","runner":"ubuntu-latest","format":"deb"},{"os":"windows","arch":"x86_64","runner":"windows-latest"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_tag || github.ref }}

      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.source_tag || github.ref_name }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected an existing version tag" >&2; exit 1; }
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" ] || { echo "Checkout does not match release tag" >&2; exit 1; }
          if [ "$MANUAL" = true ]; then
            [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ] || { echo "Manual bundles require an existing draft release" >&2; exit 1; }
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-${{ matrix.arch }}-cargo-

      - name: Install Linux build deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          # gpui (Linux) + bundling prerequisites. Kept in lockstep with the
          # same step in ci.yml, which is derived from this branch's actual
          # dependency graph rather than upstream docs:
          #   fontconfig/freetype  zed-font-kit -> yeslogic-fontconfig-sys and
          #                        freetype-sys, both pkg-config probes that
          #                        emit -lfontconfig / -lfreetype
          #   xkbcommon(+x11), xcb xkbcommon 0.8 links them directly (no
          #                        build.rs); `ldd target/release/grove` shows
          #                        libxkbcommon, libxkbcommon-x11, libxcb
          #   wayland              wayland-sys is used in dlopen mode, so it is
          #                        a *runtime* need, not a link-time one; kept
          #                        so a future non-dlopen build does not break
          #   rsvg/ssl/pkg-config  unchanged (bundling + TLS)
          #   dpkg                 cargo-bundle shells out to it for the .deb
          #                        this job ships; preinstalled on ubuntu-latest
          #                        but named explicitly so an image change can't
          #                        silently break the Linux release artifact
          # Vulkan is loaded at runtime by ash; this job never opens a window,
          # so no libvulkan here.
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libx11-dev \
            librsvg2-dev libssl-dev pkg-config dpkg xz-utils

      - name: Add cross-compile target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-bundle
        if: matrix.os != 'windows'
        run: cargo install cargo-bundle --version 0.12.0 --locked

      - name: Install cargo-wix
        if: matrix.os == 'windows'
        run: cargo install cargo-wix --locked || cargo install cargo-wix

      - name: Build release bundle (macOS/Linux)
        if: matrix.os != 'windows'
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo bundle -p grove --release --format ${{ matrix.format }} --target ${{ matrix.target }}
          else
            cargo bundle -p grove --release --format ${{ matrix.format }}
          fi

      - name: Build release binary (Windows)
        if: matrix.os == 'windows'
        run: cargo build -p grove --release --locked

      - name: Package artifacts (macOS/Linux)
        if: matrix.os != 'windows'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          OUT="dist"
          mkdir -p "$OUT"

          if [ "${{ matrix.os }}" = "macos" ]; then
            BUNDLE_DIR="target/release/bundle/osx"
            if [ -n "${{ matrix.target }}" ]; then
              BUNDLE_DIR="target/${{ matrix.target }}/release/bundle/osx"
            fi
            APP="$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.app' | head -n1)"
            [ -n "$APP" ] || { echo "no .app produced" >&2; exit 1; }
            # Ad-hoc sign: an unsigned .app downloaded via browser gets the
            # com.apple.quarantine xattr, and Gatekeeper reports totally
            # unsigned + quarantined apps as "damaged" rather than the usual
            # "unidentified developer" prompt. Ad-hoc signing (no cert/Apple
            # account needed) gives it a valid signature so Gatekeeper falls
            # back to the normal unidentified-developer flow.
            codesign --force --deep -s - "$APP"
            # Wrap the .app in a .dmg for distribution.
            DMG="$OUT/Grove-${VERSION}-macos-${{ matrix.arch }}.dmg"
            # Size from apparent bytes, not allocated blocks: compressed/sparse
            # binaries can otherwise leave hdiutil's inferred volume too small.
            APP_KIB="$(du -A -sk "$APP" | awk '{print $1}')"
            IMAGE_MIB=$(( (APP_KIB + 1023) / 1024 * 2 + 32 ))
            echo "App apparent size: $APP_KIB KiB; image capacity: $IMAGE_MIB MiB"
            df -h "$OUT"
            # hdiutil intermittently fails with "Resource busy" on GitHub
            # runners (Spotlight/quarantine racing on the fresh .app) — retry.
            for i in 1 2 3 4 5; do
              hdiutil create -volname "Grove" -srcfolder "$APP" -size "${IMAGE_MIB}m" -fs HFS+ -ov -format UDZO -imagekey zlib-level=9 "$DMG" && break
              [ "$i" = 5 ] && exit 1
              sleep 10
            done
            echo "Built $DMG"
          else
            DEB="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n1)"
            [ -n "$DEB" ] || { echo "no .deb produced" >&2; exit 1; }
            # Repack cargo-bundle's package with xz compression, preserving
            # package contents and control metadata with root ownership.
            DEB_TEMP="$(mktemp -d)"
            trap 'rm -rf -- "$DEB_TEMP"' EXIT
            dpkg-deb --raw-extract "$DEB" "$DEB_TEMP/package"
            dpkg-deb --build --root-owner-group -Zxz -z6 "$DEB_TEMP/package" "$OUT/Grove-${VERSION}-linux-amd64.deb"
            echo "Built $OUT/Grove-${VERSION}-linux-amd64.deb"
          fi

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          mkdir -p dist
          # -p grove: required since the grove-core workspace split — cargo-wix
          # refuses to guess which workspace member to package.
          cargo wix -p grove --no-build --nocapture -o "dist/Grove-${VERSION}-windows-x86_64-alpha.msi"
          echo "Built dist/Grove-${VERSION}-windows-x86_64-alpha.msi"

      - name: Upload bundles to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          fail_on_unmatched_files: true
          files: dist/*
