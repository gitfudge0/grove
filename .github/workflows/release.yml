name: Release bundles

# Build native bundles and attach them to the GitHub Release whenever a release
# is drafted (or published). Drafting a new release in the GitHub UI is enough
# to kick this off; the job uploads the artifacts back onto that same release.
on:
  release:
    types: [created, edited, prereleased, released, published]

permissions:
  contents: write

# Baked into the binary at compile time (src/telemetry.rs option_env!).
# Unset (e.g. forked-PR runs) simply ships with telemetry disabled.
env:
  GROVE_POSTHOG_KEY: ${{ secrets.GROVE_POSTHOG_KEY }}

jobs:
  bundle:
    name: Bundle (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64) — macos-latest is an arm64 runner.
          - os: macos
            arch: arm64
            runner: macos-latest
          # macOS Intel (x86_64) — macos-13 (last Intel runner) is retired;
          # cross-compile from the arm64 runner instead.
          - os: macos
            arch: x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: windows
            arch: x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-${{ matrix.arch }}-cargo-

      - name: Install Linux build deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          # gpui (Linux) + bundling prerequisites. Kept in lockstep with the
          # same step in ci.yml, which is derived from this branch's actual
          # dependency graph rather than upstream docs:
          #   fontconfig/freetype  zed-font-kit -> yeslogic-fontconfig-sys and
          #                        freetype-sys, both pkg-config probes that
          #                        emit -lfontconfig / -lfreetype
          #   xkbcommon(+x11), xcb xkbcommon 0.8 links them directly (no
          #                        build.rs); `ldd target/release/grove` shows
          #                        libxkbcommon, libxkbcommon-x11, libxcb
          #   wayland              wayland-sys is used in dlopen mode, so it is
          #                        a *runtime* need, not a link-time one; kept
          #                        so a future non-dlopen build does not break
          #   rsvg/ssl/pkg-config  unchanged (bundling + TLS)
          #   dpkg                 cargo-bundle shells out to it for the .deb
          #                        this job ships; preinstalled on ubuntu-latest
          #                        but named explicitly so an image change can't
          #                        silently break the Linux release artifact
          # Vulkan is loaded at runtime by ash; this job never opens a window,
          # so no libvulkan here.
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev \
            librsvg2-dev libssl-dev pkg-config dpkg

      - name: Add cross-compile target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-bundle
        if: matrix.os != 'windows'
        run: cargo install cargo-bundle --locked || cargo install cargo-bundle

      - name: Install cargo-wix
        if: matrix.os == 'windows'
        run: cargo install cargo-wix --locked || cargo install cargo-wix

      - name: Build release bundle (macOS/Linux)
        if: matrix.os != 'windows'
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo bundle --release --target ${{ matrix.target }}
          else
            cargo bundle --release
          fi

      - name: Build release binary (Windows)
        if: matrix.os == 'windows'
        run: cargo build --release

      - name: Package artifacts (macOS/Linux)
        if: matrix.os != 'windows'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          OUT="dist"
          mkdir -p "$OUT"

          if [ "${{ matrix.os }}" = "macos" ]; then
            BUNDLE_DIR="target/release/bundle/osx"
            if [ -n "${{ matrix.target }}" ]; then
              BUNDLE_DIR="target/${{ matrix.target }}/release/bundle/osx"
            fi
            APP="$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.app' | head -n1)"
            [ -n "$APP" ] || { echo "no .app produced" >&2; exit 1; }
            # Ad-hoc sign: an unsigned .app downloaded via browser gets the
            # com.apple.quarantine xattr, and Gatekeeper reports totally
            # unsigned + quarantined apps as "damaged" rather than the usual
            # "unidentified developer" prompt. Ad-hoc signing (no cert/Apple
            # account needed) gives it a valid signature so Gatekeeper falls
            # back to the normal unidentified-developer flow.
            codesign --force --deep -s - "$APP"
            # Wrap the .app in a .dmg for distribution.
            DMG="$OUT/Grove-${VERSION}-macos-${{ matrix.arch }}.dmg"
            # hdiutil intermittently fails with "Resource busy" on GitHub
            # runners (Spotlight/quarantine racing on the fresh .app) — retry.
            for i in 1 2 3 4 5; do
              hdiutil create -volname "Grove" -srcfolder "$APP" -ov -format UDZO "$DMG" && break
              [ "$i" = 5 ] && exit 1
              sleep 10
            done
            echo "Built $DMG"
          else
            DEB="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n1)"
            [ -n "$DEB" ] || { echo "no .deb produced" >&2; exit 1; }
            cp "$DEB" "$OUT/Grove-${VERSION}-linux-amd64.deb"
            echo "Built $OUT/Grove-${VERSION}-linux-amd64.deb"
          fi

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          mkdir -p dist
          # -p grove: required since the grove-core workspace split — cargo-wix
          # refuses to guess which workspace member to package.
          cargo wix -p grove --no-build --nocapture -o "dist/Grove-${VERSION}-windows-x86_64-alpha.msi"
          echo "Built dist/Grove-${VERSION}-windows-x86_64-alpha.msi"

      - name: Upload bundles to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
