[workspace]
resolver = "2"
members = ["term", "inputs", "zoom", "platform"]

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba", features = ["font-kit", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
portable-pty = "0.9"

# gpui-component's own Cargo.toml depends on `gpui` from this same git repo
# with no rev pinned (floating HEAD), which drifts out of sync with the rev
# we pin above and currently fails to compile upstream. Patch that edge to
# our pinned rev so only one `gpui` crate is built.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "/home/gitfudge/.cargo/git/checkouts/zed-a70e2ad075855582/1a246ef/crates/gpui" }
