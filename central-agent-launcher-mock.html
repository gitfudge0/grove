<!doctype html><html class="dark"><head><meta charset="utf-8"><title>Grove launcher in context</title><style>
:root{--BG:#eef1f5;--BG_RAIL:#fff;--BG_STRIP:#f2f4f8;--BG_HOVER:#e8edf3;--BG_HL:#ddeef6;--BORDER:#bfc8d5;--BORDER_SOFT:#dce2ea;--FG:#202638;--FG_DIM:#68738a;--FG_MUTE:#8993a5;--SEL_TINT_SOFT:#dff2f8;--SEL_RING:#197fa9;--RED:#b24e65;--GREEN:#267a55;--SCRIM:#20263866}html.dark{--BG:#11131a;--BG_RAIL:#1b1e29;--BG_STRIP:#171a24;--BG_HOVER:#252a38;--BG_HL:#2a3346;--BORDER:#3a4054;--BORDER_SOFT:#2b3040;--FG:#c0caf5;--FG_DIM:#9aa5ce;--FG_MUTE:#565f89;--SEL_TINT_SOFT:#173243;--SEL_RING:#7dcfff;--RED:#f7768e;--GREEN:#9ece6a;--SCRIM:#00000080}*{box-sizing:border-box}html,body,#viewport{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:system-ui,sans-serif;background:var(--BG);color:var(--FG)}button{font:inherit;color:inherit;cursor:pointer}#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}#viewport.panning{cursor:grabbing}#canvas{position:absolute;left:0;top:0;width:4400px;min-height:2000px;padding:56px 72px 96px;transform-origin:0 0;background:var(--BG)}.toggle,.hud{position:fixed;z-index:4;border:1px solid var(--BORDER);border-radius:4px;background:var(--BG_RAIL);box-shadow:0 3px 10px #0000001f}.toggle{top:16px;right:16px;height:22px;padding:0 8px;font-size:10px}.hud{right:16px;bottom:16px;display:flex;overflow:hidden}.hud>*{height:22px;min-width:28px;padding:0 7px;border:0;border-right:1px solid var(--BORDER);background:transparent;font:10px ui-monospace,monospace}.page h1{margin:0 0 6px;font-size:22px}.page p{margin:0;color:var(--FG_DIM);font-size:12px}.legend{display:flex;gap:16px;margin-top:12px;color:var(--FG_MUTE);font:10px ui-monospace,monospace}.legend b,.id,.section i{color:var(--SEL_RING)}.section{display:flex;gap:8px;align-items:center;margin:34px 0 12px;font-size:13px}.section i{display:grid;place-items:center;width:20px;height:20px;border:1px solid var(--SEL_RING);border-radius:4px;font:10px ui-monospace,monospace;font-style:normal}.row{display:flex;gap:32px;align-items:flex-start}.frame{width:1280px;flex:none}.caption{height:40px;display:flex;gap:6px;color:var(--FG_DIM);font-size:11px}.caption b{color:var(--FG)}.caption p{margin:0}.id{display:grid;place-items:center;width:28px;height:18px;border:1px solid var(--SEL_RING);border-radius:4px;font:10px ui-monospace,monospace}.arrow{margin:400px -23px 0;color:var(--FG_MUTE);font:18px ui-monospace,monospace}.app{position:relative;width:1280px;height:800px;overflow:hidden;border:1px solid var(--BORDER);border-radius:6px;background:var(--BG);box-shadow:0 12px 40px #00000059}.bar{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--BORDER);background:var(--BG_STRIP);font-size:11px}.brand{font-weight:700;letter-spacing:1px}.mono{font-family:ui-monospace,monospace}.muted{color:var(--FG_MUTE)}.push{margin-left:auto}.tinybtn,.done{height:22px;padding:0 7px;border:1px solid var(--BORDER);border-radius:4px;background:transparent;font-size:10px}.body{display:flex;height:730px}.rail{width:320px;flex:none;border-right:1px solid var(--BORDER);background:var(--BG_RAIL)}.railhead,.sect{padding:10px 12px 6px;color:var(--FG_MUTE);font:10px ui-monospace,monospace}.railhead{height:38px;border-bottom:1px solid var(--BORDER_SOFT);padding-top:12px}.rrow{display:flex;gap:6px;align-items:center;min-height:30px;padding:4px 12px;font-size:11px;color:var(--FG_DIM)}.rrow.active{background:var(--BG_HL);color:var(--FG)}.dot{color:var(--GREEN)}.count{margin-left:auto;color:var(--FG_MUTE);font:10px ui-monospace,monospace}.main{flex:1;background:#14151c}.head{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--BORDER);background:var(--BG);font-size:11px}.pty{padding:16px;color:#b9c5e8;font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap}.status{height:26px;display:flex;align-items:center;gap:12px;padding:0 12px;border-top:1px solid var(--BORDER);background:var(--BG_STRIP);color:var(--FG_MUTE);font:10px ui-monospace,monospace}.scrim{position:absolute;inset:44px 0 26px;background:var(--SCRIM)}.modal{position:absolute;top:80px;left:320px;width:640px;height:208px;border:1px solid var(--BORDER);border-radius:12px;background:var(--BG_RAIL);box-shadow:0 12px 40px #00000059}.prompt{padding:16px;font-size:12px;line-height:18px}.caret,.summary b{color:var(--SEL_RING)}.foot{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;gap:6px;height:50px;padding:8px 16px;border-top:1px solid var(--BORDER);background:var(--BG_STRIP)}.cue,.icon,.send{height:22px;border-radius:4px}.cue{padding:0 6px;border:1px solid var(--BORDER);background:var(--BG_HL);font-size:11px}.cue b{font-weight:500}.icon,.send{display:grid;place-items:center;width:28px;padding:0;border:0;background:transparent}.icon.selected{border:1px solid var(--SEL_RING);background:var(--BG_HL);color:var(--SEL_RING)}.icon.disabled{background:var(--BORDER_SOFT);color:var(--FG_MUTE)}.send{background:var(--SEL_RING);color:var(--BG);font-size:14px}.send.disabled{background:var(--BORDER_SOFT);color:var(--FG_MUTE)}.summary,.error{position:absolute;bottom:52px;left:16px;right:16px;font:10px ui-monospace,monospace}.summary{color:var(--FG_MUTE)}.error{color:var(--RED)}.picker{position:absolute;top:130px;left:336px;width:416px;padding:8px;border:1px solid var(--BORDER);border-radius:6px;background:var(--BG_RAIL);box-shadow:0 12px 40px #00000059}.search{height:22px;padding:4px 6px;border:1px solid var(--BORDER);border-radius:4px;background:var(--BG_STRIP);color:var(--FG_MUTE);font:11px ui-monospace,monospace}.group{margin-top:8px;color:var(--FG_MUTE);font:10px ui-monospace,monospace}.wt{display:flex;align-items:center;gap:6px;height:54px;padding:0 12px;border-top:1px solid var(--BORDER_SOFT);color:var(--FG_DIM);font:12px ui-monospace,monospace}.wt.on{background:var(--SEL_TINT_SOFT);box-shadow:inset 2px 0 var(--SEL_RING);color:var(--FG)}.path{margin-left:auto;color:var(--FG_MUTE);font-size:11px}.pickfoot{display:flex;gap:8px;align-items:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--BORDER_SOFT);font:10px ui-monospace,monospace}.note{position:absolute;left:3960px;top:1610px;width:280px;padding:12px;border:1px solid var(--SEL_RING);border-radius:6px;background:var(--BG_RAIL);font-size:11px}.note b{display:block;color:var(--SEL_RING)}
</style></head><body><button class="toggle" id="theme">Light theme</button><div class="hud"><button id="minus">−</button><span id="pct">100%</span><button id="plus">+</button><button id="fit">Fit</button></div><div id="viewport"><main id="canvas"><header class="page"><h1>Central launcher in Grove</h1><p>One launch creates one session with selected worktree paths as context roots.</p><div class="legend"><span><b>A</b> prelaunch</span><span><b>B</b> choose worktrees</span><span><b>C</b> start</span><span><b>D</b> recovery</span><span><b>E</b> small desktop</span></div></header><div id="board"></div><aside class="note"><b>Launch contract</b>One launch creates one app session. Selected <span class="mono">worktree_paths[]</span> become its context roots.</aside></main></div>
<script>
const apps=(on='Claude Code')=>['Codex','Claude Code','OpenCode'].map(x=>'<button class="icon '+(x===on?'selected':'')+'" title="'+x+'" aria-label="'+x+'">'+(x==='Codex'?'◇':x==='Claude Code'?'◌':'⌘')+'</button>').join('');const footer=(n=3,on='Claude Code',extra='')=>'<div class="foot"><button class="cue">Worktrees <b>'+n+' selected</b></button><span class="push"></span>'+extra+apps(on)+'<button class="send">↑</button></div>';const chrome=(extra='',name='Claude Code',roots='3 context roots',small=false)=>'<div class="bar"><b class="brand">GROVE</b><span class="mono muted">native · tmux</span><span class="push"></span><button class="tinybtn">−</button><button class="tinybtn">100%</button><button class="tinybtn">+</button></div><div class="body"><aside class="rail" '+(small?'style="width:220px"':'')+'><div class="railhead">ACTIVITY</div><div class="sect">RUNNING</div><div class="rrow active"><span class="dot">●</span><span>'+name+'</span><span class="count">1</span></div><div class="rrow"><span>▸</span><span>central-launcher</span></div><div class="sect">IDLE</div><div class="rrow"><span>·</span><span>review terminal resize</span></div><div class="sect">WORKTREES</div><div class="rrow"><span>⌄</span><span>grove</span><span class="count">2</span></div><div class="rrow"><span>⌄</span><span>ledger</span><span class="count">1</span></div></aside><main class="main"><div class="head"><b>'+name+'</b><span class="mono muted">/ '+roots+'</span><span class="push"></span><span class="mono muted">pty</span></div><div class="pty"><span style="color:var(--SEL_RING)">claude</span> <span class="muted">~/dev/grove</span>\n\n<span style="color:var(--GREEN)">✓</span> attached terminal\n<span style="color:var(--GREEN)">✓</span> workspace indexed\n\n<span style="color:var(--SEL_RING)">›</span> Waiting for a task.\n\n<span class="muted">$ cargo test launcher --quiet</span></div></main></div><div class="status"><span>● 1 running</span><span>backend: local</span><span>theme: tokyo night</span><span class="push"></span><span>v0.9.0</span></div>'+extra;const modal=(text,n=3,on='Claude Code',extra='')=>'<div class="scrim"></div><section class="modal"><div class="prompt">'+text+'<span class="caret">▏</span></div>'+extra+footer(n,on)+'</section>';const pick='<div class="picker"><div class="search">⌕ search worktrees</div><div class="group">GROVE</div><div class="wt on">☑ main <span class="path">grove/main</span></div><div class="wt on">☑ feature/central-launcher <span class="path">grove/feature/central-launcher</span></div><div class="wt">☐ fix/terminal-resize <span class="path">grove/fix/terminal-resize</span></div><div class="group">LEDGER</div><div class="wt on">☑ main <span class="path">ledger/main</span></div><div class="pickfoot"><span>3 selected</span><span class="push"></span><button class="done">Done</button></div></div>';const frame=(id,name,copy,body,w=1280,h=800)=>'<article class="frame" style="width:'+w+'px"><div class="caption"><span class="id">'+id+'</span><b>'+name+'</b><p>'+copy+'</p></div><section class="app" style="width:'+w+'px;height:'+h+'px">'+body+'</section></article>';const row=x=>'<div class="row">'+x.join('<div class="arrow">→</div>')+'</div>';let out='';
out+='<div class="section"><i>A</i> Prelaunch</div>'+row([frame('A1','Ordinary terminal','Active Claude terminal exposes the native launch shortcut.',chrome('<span style="position:absolute;right:12px;top:47px" class="mono muted">⌘↵ new launch</span>')),frame('A2','Launcher open','Flat scrim and 640px launcher drop 80px below the appbar.',chrome(modal('Implement the central launcher so selected worktrees become context for one session.')))]);
out+='<div class="section"><i>B</i> Worktree picker</div>'+row([frame('B1','Picker open','Project headers orient the list. Only worktree rows are selectable.',chrome(modal('Implement the central launcher.')+pick)),frame('B2','Ready','Three selected worktrees and Claude Code enabled for launch.',chrome(modal('Implement the central launcher with selected worktrees as context.',3,'Claude Code','<div class="summary"><b>3 worktrees</b> · grove/main · grove/feature/central-launcher · ledger/main</div>')))]);
out+='<div class="section"><i>C</i> New session</div>'+row([frame('C1','Starting','Launcher freezes targets while Claude Code starts.',chrome(modal('Implement the central launcher.',3,'Claude Code','<div class="summary">◌ starting Claude Code with 3 worktrees</div><div class="foot"><button class="cue">Worktrees <b>3 selected</b></button><span class="push"></span>'+apps('Claude Code')+'<button class="send">stop</button></div>'))),frame('C2','Session created','Scrim gone. Activity and PTY confirm exactly one new Claude session.',chrome('','Claude Code','3 context roots'))]);
out+='<div class="section"><i>D</i> Recovery</div>'+row([frame('D1','Local service failure','Prompt is preserved. Retry remains beside selected Claude Code.',chrome(modal('Implement the central launcher.',3,'Claude Code','<div class="error">Could not start Claude Code. Local service did not respond.</div><div class="foot"><button class="cue">Worktrees <b>3 selected</b></button><span class="push"></span>'+apps('Claude Code')+'<button class="done">Retry</button><button class="send">↑</button></div>'))),frame('D2','Stale path','Missing worktree blocks Send until repaired.',chrome(modal('Implement the central launcher.',3,'Codex','<div class="error">Missing worktree: grove/feature/central-launcher <button class="done" style="float:right">Remove</button><button class="done" style="float:right;margin-right:4px">Refresh</button></div><div class="foot"><button class="cue">Worktrees <b>3 selected</b></button><span class="push"></span>'+apps('Codex')+'<button class="send disabled">↑</button></div>')))]);
out+='<div class="section"><i>E</i> Small desktop</div>'+row([frame('E1','1024px fit','Rail clamps toward 220px. Launcher remains at 640px and summary truncates.',chrome(modal('Implement the central launcher with selected worktrees.',3,'Claude Code','<div class="summary"><b>3 worktrees</b> · grove/main · grove/feature/central-launcher…</div>'),'Claude Code','3 context roots',true),1024,700)]);
document.getElementById('board').innerHTML=out;const vp=document.getElementById('viewport'),cv=document.getElementById('canvas'),pct=document.getElementById('pct');let x=0,y=0,z=1,d=0,sx,sy,bx,by;const lo=.1,hi=2.5,draw=()=>{cv.style.transform=`translate(${x}px,${y}px) scale(${z})`;pct.textContent=Math.round(z*100)+'%'},fit=()=>{const w=cv.scrollWidth,h=cv.scrollHeight;z=Math.max(lo,Math.min(hi,Math.min(innerWidth/w,innerHeight/h)*.9));x=(innerWidth-w*z)/2;y=Math.max(12,(innerHeight-h*z)/2);draw()};vp.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey){const n=Math.max(lo,Math.min(hi,z*Math.exp(-e.deltaY*.01)));x=e.clientX-(e.clientX-x)*n/z;y=e.clientY-(e.clientY-y)*n/z;z=n}else{x-=e.deltaX;y-=e.deltaY}draw()},{passive:false});vp.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;d=1;sx=e.clientX;sy=e.clientY;bx=x;by=y;vp.classList.add('panning');vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(!d)return;x=bx+e.clientX-sx;y=by+e.clientY-sy;draw()});vp.addEventListener('pointerup',()=>{d=0;vp.classList.remove('panning')});minus.onclick=()=>{z=Math.max(lo,z/1.18);draw()};plus.onclick=()=>{z=Math.min(hi,z*1.18);draw()};fit.onclick=fit;theme.onclick=()=>{document.documentElement.classList.toggle('dark');theme.textContent=document.documentElement.classList.contains('dark')?'Light theme':'Dark theme'};document.querySelectorAll('.appicon').forEach(a=>a.onclick=()=>{a.parentElement.querySelectorAll('.appicon').forEach(x=>x.classList.remove('selected'));a.classList.add('selected')});addEventListener('resize',fit);requestAnimationFrame(fit);
</script></body></html>
